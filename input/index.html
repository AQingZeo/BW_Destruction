<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KL Field — Input</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <p class="prompt">
      <label for="textInput">
        Tell me, tell me <span id="typewriter" class="typewriter" aria-live="polite"></span><span class="cursor" aria-hidden="true">|</span>
      </label>
    </p>

    <input
      id="textInput"
      type="text"
      placeholder="hit enter to send"
      autocomplete="off"
    />
  </div>

  <script>window.POSTER_PROJECT = 'destruction';</script>
  <script type="module" src="input.js"></script>
</body>
</html>
